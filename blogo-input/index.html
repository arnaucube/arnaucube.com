    <script>
      document.addEventListener("DOMContentLoaded", function() {
        renderMathInElement(document.body, {
          displayMode: false,
          // customised options
          // • auto-render specific keys, e.g.:
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: "\\[", right: "\\]", display: true},
            {left: "\\(", right: "\\)", display: false},
            {left: "\\begin{equation}", right: "\\end{equation}", display: true}
          ],
          // • rendering keys, e.g.:
          throwOnError : true
        });
      });

      ///
      let theme = localStorage.getItem("theme");
      if ((theme === "light-theme")||(theme==null)) {
          theme = "light-theme";
          document.getElementById("themeSwitcher").checked = false;
      } else if (theme === "dark-theme") {
          theme = "dark-theme";
          document.getElementById("themeSwitcher").checked = true;
      }
      document.body.className = theme;
      localStorage.setItem("theme", theme);

      function switchTheme() {
        theme = localStorage.getItem("theme");
        if (theme === "light-theme") {
          theme = "dark-theme";
          document.getElementById("themeSwitcher").checked = true;
        } else {
          theme = "light-theme";
          document.getElementById("themeSwitcher").checked = false;
        }
        document.body.className = theme;
        localStorage.setItem("theme", theme);

        console.log(theme);
      }
    </script>
    <script>
    function tagLinks(tagName) {
      var tags = document.getElementsByTagName(tagName);
      for (var i=0, hElem; hElem =  tags[i]; i++) {
        if (hElem.parentNode.className=="row postThumb") {
          continue;
        }
        hElem.id = hElem.innerHTML.toLowerCase().replace(" ", "-");
        hElem.innerHTML = "<a style='color:black!important;' href='#"+hElem.id+"'>"+hElem.innerHTML+"</a>";
      }
    }
    tagLinks("h2");
    tagLinks("h3");
    tagLinks("h4");
    tagLinks("h5");
    </script>
    <script>
function generateTOC(tocContainerId = "toc") {
    const tocContainer = document.getElementById(tocContainerId);
    if (!tocContainer) return;

    const headings = document.querySelectorAll("h2, h3, h4, h5, h6");
    if (!headings.length) return;

    // Generate IDs if missing
    headings.forEach((heading, index) => {
        if (!heading.id) {
            heading.id =
                heading.textContent
                    .trim()
                    .toLowerCase()
                    .replace(/[^\w\s-]/g, "")
                    .replace(/\s+/g, "-") +
                "-" +
                index;
        }
    });

    const toc = document.createElement("ul");
    let currentLevel = 1;
    let currentList = toc;
    const stack = [toc];

    headings.forEach((heading) => {
        const level = parseInt(heading.tagName.substring(1), 10);

        const li = document.createElement("li");
        const a = document.createElement("a");

        a.href = "#" + heading.id;
        a.textContent = heading.textContent;

        li.appendChild(a);

        if (level > currentLevel) {
            for (let i = currentLevel; i < level; i++) {
                const nestedList = document.createElement("ul");

                const lastLi =
                    currentList.lastElementChild ||
                    currentList.appendChild(document.createElement("ul"));

                lastLi.appendChild(nestedList);

                stack.push(nestedList);
                currentList = nestedList;
            }
        } else if (level < currentLevel) {
            for (let i = currentLevel; i > level; i--) {
                stack.pop();
            }
            currentList = stack[stack.length - 1];
        }

        currentList.appendChild(li);
        currentLevel = level;
    });

    tocContainer.innerHTML = "";
    tocContainer.appendChild(toc);
}

document.addEventListener("DOMContentLoaded", () => {
    generateTOC();
});
    </script>
